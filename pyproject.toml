[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "vulndify-mcp-server"
version = "0.1.0"
description = "A minimal MCP server demo exposing a hello tool."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "server", "tool"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "mcp[cli]>=1.14.0,<2",
  "pydantic>=2.13.4",
  "requests>=2.34.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "pytest>=8.3.0",
  "twine>=6.1.0",
]

[project.scripts]
vulndify-mcp-server = "vulndify_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulndify_mcp_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
